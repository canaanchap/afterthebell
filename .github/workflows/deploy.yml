name: Deploy site (archive + belltower) to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps (Quartz)
        working-directory: quartz
        run: npm ci

      - name: Build Quartz into public/archive
        working-directory: quartz
        run: npx quartz build -o ../public/archive

      - name: Copy belltower into public/belltower
        run: |
          mkdir -p public/belltower
          rsync -a --delete belltower/ public/belltower/

      - name: Root landing page
        run: |
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width,initial-scale=1" />
              <title>After the Bell</title>
              <style>
                body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:760px;margin:48px auto;padding:0 16px;line-height:1.5}
                a{display:inline-block;margin-right:16px}
              </style>
            </head>
            <body>
              <h1>After the Bell</h1>
              <p>
                <a href="./belltower/">Belltower</a>
                <a href="./archive/">Archive</a>
              </p>
            </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
