<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f5;--sur:#fff;--sur2:#f7f8fa;--bdr:#e2e8f0;
  --acc:#6c63ff;--acc-bg:#ede9fe;--txt:#1e293b;--mut:#94a3b8;
  --red:#ef4444;--r:12px;--rs:8px;--cw:305px;
  --sh:0 1px 3px rgba(0,0,0,.07),0 4px 12px rgba(0,0,0,.05);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
*{scrollbar-color:var(--bdr) transparent;scrollbar-width:thin}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
/* ── Header ── */
header{display:flex;align-items:center;gap:9px;padding:10px 16px;background:var(--sur);border-bottom:1px solid var(--bdr);flex-shrink:0;min-height:52px}
#btitle{font-size:.95rem;font-weight:700;color:var(--acc);cursor:pointer;user-select:none;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
#btitle-in{font-size:.95rem;font-weight:700;background:var(--sur2);border:1.5px solid var(--acc);border-radius:6px;color:var(--txt);padding:2px 8px;outline:none;display:none;max-width:180px;font-family:inherit}
#hfile{font-size:.7rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;flex-shrink:1}
#hfile code{color:var(--acc);font-family:'SF Mono','Fira Mono',monospace;font-size:.67rem}
.hsp{flex:1}
#sstatus{font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;transition:all .2s;cursor:pointer}
#sstatus:hover{filter:brightness(.92)}
.ss-ok{background:#dcfce7;color:#15803d}.ss-ing{background:#fef9c3;color:#a16207}.ss-err{background:#fee2e2;color:#b91c1c}
.hbtn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border:1px solid var(--bdr);border-radius:var(--rs);font-size:.78rem;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;color:var(--mut);transition:all .12s;white-space:nowrap}
.hbtn:hover{background:var(--sur2);color:var(--txt)}
#hdr-sett{font-size:1.15rem;padding:5px 10px}
/* ── Filter bar ── */
#filter-bar{display:flex;align-items:center;gap:8px;padding:5px 16px;background:var(--sur);border-bottom:1px solid var(--bdr);flex-shrink:0}
.fb-label{font-size:.65rem;font-weight:700;color:var(--mut);letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.filter-btn{background:transparent;border:1px solid var(--bdr);border-radius:20px;padding:2px 10px;font-size:.7rem;font-weight:600;font-family:inherit;cursor:pointer;color:var(--mut);transition:all .12s;white-space:nowrap}
.filter-btn:hover{border-color:var(--acc);color:var(--acc)}
.filter-btn.active{background:var(--acc);color:#fff;border-color:var(--acc)}
/* ── LS Warning ── */
#ls-warn{position:fixed;top:60px;right:12px;z-index:300;padding:9px 13px;border-radius:var(--rs);font-size:.8rem;font-weight:600;display:none;align-items:center;gap:8px;box-shadow:var(--sh);max-width:340px;animation:slideIn .2s ease}
#ls-warn.warn{background:#fef9c3;color:#a16207;border:1px solid #fde68a}
#ls-warn.crit{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5}
#ls-warn-x{background:none;border:none;cursor:pointer;color:inherit;font-size:.85rem;padding:0 2px;opacity:.6;line-height:1;flex-shrink:0}
#ls-warn-x:hover{opacity:1}
@keyframes slideIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
/* ── Board ── */
#board{display:flex;gap:13px;padding:14px;overflow-x:auto;overflow-y:hidden;flex:1;align-items:flex-start;-webkit-overflow-scrolling:touch}
/* ── Column ── */
.col{background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--r);width:var(--cw);min-width:var(--cw);max-height:calc(100dvh - 80px);display:flex;flex-direction:column;flex-shrink:0;transition:box-shadow .12s,background .12s;overflow:hidden}
.col.drop-hi{background:#f5f3ff;box-shadow:0 0 0 2px var(--acc)}
/* ── Column header ── */
.ch{display:flex;align-items:center;gap:7px;padding:11px 12px 8px;border-bottom:1px solid var(--bdr);flex-shrink:0}
/* Color dot + hover picker */
.cdot-wrap{position:relative;display:inline-flex;align-items:center;flex-shrink:0}
.cdot-wrap::after{content:'';position:absolute;top:100%;left:0;right:0;height:8px} /* hover bridge */
.cdot{width:9px;height:9px;border-radius:50%;cursor:pointer;transition:transform .1s}.cdot:hover{transform:scale(1.4)}
.col-cpick{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rs);padding:7px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:60;box-shadow:var(--sh);width:88px}
.cdot-wrap:hover .col-cpick,.col-cpick:hover{opacity:1;pointer-events:all}
.cpick-sw{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s,border-color .1s}.cpick-sw:hover{transform:scale(1.15)}.cpick-sw.cur{border-color:#333}
.ctitle{font-size:.77rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--txt);flex:1;cursor:text;outline:none;background:transparent;border:none;font-family:inherit;min-width:0}.ctitle:focus{color:var(--acc)}
.ccount{font-size:.67rem;font-weight:700;background:var(--bdr);color:var(--mut);padding:1px 7px;border-radius:20px;flex-shrink:0}
.cdel{background:none;border:none;color:var(--mut);cursor:pointer;font-size:.85rem;padding:2px 4px;border-radius:4px;opacity:0;transition:opacity .1s,color .1s;line-height:1}.ch:hover .cdel{opacity:1}.cdel:hover{color:var(--red)}
/* Column progress */
.col-prog-wrap{padding:5px 12px 3px;flex-shrink:0}
.col-prog-bar{height:3px;background:var(--bdr);border-radius:2px;overflow:hidden}
.col-prog-fill{height:100%;background:var(--acc);transition:width .3s}
.col-prog-label{display:flex;justify-content:space-between;font-size:.62rem;color:var(--mut);margin-bottom:2px}
/* ── Cards ── */
.cards{display:flex;flex-direction:column;gap:7px;padding:9px;overflow-y:auto;flex:1}
/* ── Card ── */
.card{background:var(--sur);border:1px solid var(--bdr);border-left:3px solid var(--cc,var(--acc));border-radius:var(--rs);padding:9px 10px 18px;position:relative;touch-action:none;user-select:none;transition:box-shadow .1s}
.card:hover{box-shadow:var(--sh)}
.card.dsrc{opacity:.15;pointer-events:none}
.card.dhi-before{border-top:2.5px solid var(--acc)}
.card.dhi-after{border-bottom:2.5px solid var(--acc)}
.ctext{font-size:.83rem;line-height:1.55;color:var(--txt);word-break:break-word;white-space:pre-wrap;margin-bottom:0}
.card-edit-ta{width:100%;background:var(--sur2);border:1.5px solid var(--acc);border-radius:6px;color:var(--txt);font-family:inherit;font-size:.83rem;padding:5px 7px;resize:none;outline:none;line-height:1.55;display:block;min-height:36px}
/* Card actions (top-right, hover) */
.cact{position:absolute;top:6px;right:6px;display:flex;gap:2px;opacity:0;transition:opacity .1s}.card:hover .cact{opacity:1}
.cbtn{background:var(--sur2);border:1px solid var(--bdr);color:var(--mut);cursor:pointer;font-size:.67rem;padding:2px 5px;border-radius:4px;font-family:inherit;line-height:1.3;transition:all .1s}.cbtn:hover{color:var(--txt);background:var(--bdr)}.cbtn.del:hover{color:var(--red);border-color:var(--red)}
/* ── Note button ── */
.note-btn{background:none;border:none;color:var(--mut);cursor:pointer;font-size:.78rem;padding:2px 4px;border-radius:4px;line-height:1;transition:opacity .12s,color .12s;opacity:0;flex-shrink:0}
.card:hover > .cfoot .note-btn{opacity:.6}
.stask:hover .note-btn{opacity:.6}
.note-btn.has-note{opacity:.4;color:var(--acc)}
.card:hover > .cfoot .note-btn.has-note,.stask:hover .note-btn.has-note,.note-btn.has-note:hover{opacity:1}
/* ── Subtasks ── */
.subtasks{margin-top:7px;display:flex;flex-direction:column;gap:1px}
.stask{display:flex;flex-direction:column;border-radius:4px}
.stask-row{display:flex;align-items:flex-start;gap:5px;padding:2px 0}
.stask.st-src{opacity:.2}
.stask.st-dhi-before{border-top:2px solid var(--acc)}
.stask.st-dhi-after{border-bottom:2px solid var(--acc)}
.st-handle{color:var(--mut);cursor:grab;font-size:.72rem;padding:0 1px;opacity:0;transition:opacity .1s;flex-shrink:0;margin-top:3px;line-height:1}.stask:hover .st-handle{opacity:1}
/* State button + hover mini menu */
.st-state-wrap{position:relative;display:inline-flex;align-items:center;flex-shrink:0;margin-top:1px}
.st-state-wrap::after{content:'';position:absolute;left:100%;top:-8px;bottom:-8px;width:10px}
.st-state-btn{width:14px;height:14px;border:1.5px solid #c8d3e0;border-radius:3px;background:var(--sur);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:.6rem;color:#94a3b8;padding:0;line-height:1;font-family:inherit;transition:border-color .1s,color .1s,background .1s;flex-shrink:0}
.st-state-btn[data-state="null"]{color:transparent}
.st-state-btn[data-state="done"]{border-color:#86efac;color:#22c55e;background:#f0fdf4;font-weight:700}
.st-mini-menu{position:absolute;left:calc(100% + 6px);top:50%;transform:translateY(-50%);display:flex;gap:1px;align-items:center;background:var(--sur);border:1px solid var(--bdr);border-radius:20px;padding:2px 4px;box-shadow:0 2px 12px rgba(0,0,0,.12);opacity:0;pointer-events:none;transition:opacity .12s;z-index:45;white-space:nowrap}
.st-state-wrap:hover .st-mini-menu,.st-mini-menu:hover{opacity:1;pointer-events:all}
.st-mm-btn{background:none;border:none;cursor:pointer;font-size:.72rem;padding:2px 6px;border-radius:14px;line-height:1;font-family:inherit;color:var(--mut);transition:background .1s,color .1s;white-space:nowrap}
.st-mm-btn:hover,.st-mm-btn.active{background:var(--sur2)}
.st-mm-btn[data-target="inprogress"]:hover,.st-mm-btn[data-target="inprogress"].active{color:var(--acc)}
.st-mm-btn[data-target="delegated"]:hover,.st-mm-btn[data-target="delegated"].active{color:#f97316}
.st-mm-btn[data-target="outofscope"]:hover,.st-mm-btn[data-target="outofscope"].active{color:#ef4444}
.st-mm-btn[data-target="later"]:hover,.st-mm-btn[data-target="later"].active{color:#64748b}
.st-lbl{flex:1;font-size:.77rem;line-height:1.4;color:var(--txt);cursor:text;outline:none;word-break:break-word;white-space:pre-wrap}
.stask[data-state="done"] .st-lbl{text-decoration:line-through;opacity:.4}
.stask[data-state="outofscope"] .st-lbl{text-decoration:line-through;opacity:.45;color:var(--mut)}
.stask[data-state="later"] .st-lbl{opacity:.6;font-style:italic}
.st-del{background:none;border:none;color:var(--mut);cursor:pointer;font-size:.65rem;opacity:0;transition:opacity .1s;padding:0 2px;line-height:1;flex-shrink:0;margin-top:3px}.stask:hover .st-del{opacity:1}.st-del:hover{color:var(--red)}
/* Subtask progress bar */
.st-prog-row{display:flex;align-items:center;gap:4px;padding:0 2px 3px 20px}
.st-prog-bar{flex:1;height:2px;border-radius:2px;background:var(--bdr);overflow:hidden}
.st-prog-fill{height:100%;border-radius:2px;transition:width .2s;opacity:.6}
.st-prog-pct{font-size:.54rem;font-weight:600;min-width:20px;text-align:right;transition:color .2s;opacity:.5}
.add-stask-row{display:flex;gap:4px;margin-top:5px;opacity:0;transition:opacity .1s}.card:hover .add-stask-row{opacity:1}
.add-stask-row input{flex:1;background:var(--sur2);border:1px solid var(--bdr);border-radius:4px;color:var(--txt);font-family:inherit;font-size:.75rem;padding:3px 7px;outline:none}.add-stask-row input:focus{border-color:var(--acc)}
.st-add-btn{background:none;border:none;color:var(--mut);cursor:pointer;font-size:.75rem;padding:2px 5px;border-radius:4px;line-height:1.2}.st-add-btn:hover{color:var(--acc)}
/* ── Card footer ── */
.cfoot{display:flex;align-items:center;gap:5px;margin-top:8px;flex-wrap:wrap}
.clabel{display:inline-flex;align-items:center;font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:20px;cursor:pointer;white-space:nowrap;transition:opacity .1s}.clabel:hover{opacity:.7}
.cstatus{font-size:.66rem;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--sur2);color:var(--mut);cursor:pointer;border:1px solid var(--bdr);white-space:nowrap;transition:all .1s}.cstatus:hover{border-color:var(--acc);color:var(--acc)}
.prog-row{display:flex;align-items:center;gap:4px;flex:1;min-width:70px}
.prog-bar-wrap{flex:1;height:4px;background:var(--bdr);border-radius:2px;overflow:hidden;min-width:28px}
.prog-fill{height:100%;background:var(--acc);border-radius:2px;transition:width .25s}
.prog-pct{font-size:.65rem;font-weight:700;color:var(--mut);min-width:24px;text-align:right}
.prog-btns{display:flex;gap:2px;opacity:0;transition:opacity .1s}.card:hover .prog-btns{opacity:1}
.pc{background:var(--sur2);border:1px solid var(--bdr);color:var(--mut);cursor:pointer;font-size:.62rem;padding:1px 4px;border-radius:3px;line-height:1.4;font-family:inherit}.pc:hover{color:var(--acc);border-color:var(--acc)}
.cstrip{position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--bdr)}
.cstrip-fill{height:100%;background:var(--acc);transition:width .3s}
/* ── Add card ── */
.aca{padding:5px 9px 9px;flex-shrink:0}
.acbtn{width:100%;background:transparent;border:1px dashed var(--bdr);color:var(--mut);border-radius:var(--rs);padding:7px;font-size:.78rem;font-family:inherit;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;gap:5px}
.acbtn:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}
.acform{display:none;flex-direction:column;gap:6px}.acform.open{display:flex}
.acform textarea{background:var(--sur2);border:1.5px solid var(--acc);border-radius:var(--rs);color:var(--txt);font-family:inherit;font-size:.83rem;padding:7px 9px;resize:none;outline:none;line-height:1.5;min-height:62px}
.acform textarea::placeholder{color:var(--mut)}
.frow{display:flex;align-items:center;gap:5px}
.lpick{display:flex;gap:3px}
.ldot{width:13px;height:13px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s}.ldot:hover{transform:scale(1.2)}.ldot.sel{border-color:#333}
/* ── Add column ── */
.acol-wrap{flex-shrink:0;display:flex;align-items:flex-start}
.acol-btn{background:transparent;border:1px dashed var(--bdr);border-radius:var(--r);color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;padding:18px 14px;width:170px;font-size:.82rem;font-family:inherit;transition:all .12s}
.acol-btn:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}
.acol-form{background:var(--sur);border:1px solid var(--acc);border-radius:var(--r);padding:12px;display:none;flex-direction:column;gap:8px;width:190px}
.acol-form.open{display:flex}
.acol-form input{background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--rs);color:var(--txt);font-family:inherit;font-size:.83rem;padding:6px 9px;outline:none;width:100%}.acol-form input:focus{border-color:var(--acc)}
.crow{display:flex;gap:4px;flex-wrap:wrap}
.csw{width:17px;height:17px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s}.csw:hover{transform:scale(1.15)}.csw.sel{border-color:#333}
/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 13px;border:none;border-radius:var(--rs);font-size:.82rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all .12s}
.bp{background:var(--acc);color:#fff}.bp:hover{background:#5a52e0}
.bg{background:transparent;color:var(--mut);border:1px solid var(--bdr)}.bg:hover{background:var(--sur2);color:var(--txt)}
/* ── Note popover ── */
#npop{position:fixed;width:300px;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:0 8px 32px rgba(0,0,0,.12);z-index:250;display:none;flex-direction:column;overflow:hidden;transition:width .18s}
#npop.wide{width:580px}
.npop-head{display:flex;align-items:center;border-bottom:1px solid var(--bdr);padding:4px 6px 4px 12px;flex-shrink:0;min-height:32px;gap:2px}
.npop-label{font-size:.7rem;font-weight:600;color:var(--mut);flex:1;letter-spacing:.2px}
.npop-clr{opacity:0;transition:opacity .15s,color .1s,background .1s;background:none;border:none;color:var(--mut);cursor:pointer;font-size:.67rem;padding:3px 5px;line-height:1;border-radius:4px;white-space:nowrap}
#npop:hover .npop-clr{opacity:.6}.npop-clr:hover{opacity:1!important;color:var(--red);background:var(--sur2)}
.npop-x{background:none;border:none;color:var(--mut);cursor:pointer;font-size:.85rem;padding:3px 5px;line-height:1;border-radius:4px}.npop-x:hover{color:var(--txt);background:var(--sur2)}
#npop-body{display:flex;min-height:180px;max-height:340px;overflow:hidden}
#npop-ta{flex:1;border:none;border-right:1px solid var(--bdr);background:var(--sur2);color:var(--txt);font-family:inherit;font-size:.82rem;padding:10px 12px;resize:none;outline:none;line-height:1.55;display:none;min-width:0}
#npop-ta::placeholder{color:var(--mut)}
#npop-prev{flex:1;overflow-y:auto;padding:10px 14px;font-size:.82rem;line-height:1.65;cursor:text;min-width:0}
#npop-prev:hover{background:var(--sur2)}
/* Markdown preview typography */
#npop-prev h1{font-size:1.05rem;font-weight:700;margin:0 0 8px}
#npop-prev h2{font-size:.9rem;font-weight:700;margin:10px 0 6px}
#npop-prev h3{font-size:.82rem;font-weight:700;margin:8px 0 4px}
#npop-prev p{margin-bottom:7px}
#npop-prev ul,#npop-prev ol{padding-left:16px;margin-bottom:7px}
#npop-prev li{margin-bottom:2px}
#npop-prev code{background:var(--sur2);padding:1px 4px;border-radius:3px;font-family:'SF Mono',monospace;font-size:.78rem;border:1px solid var(--bdr)}
#npop-prev blockquote{border-left:3px solid var(--acc);padding-left:10px;color:var(--mut);margin:6px 0;font-style:italic}
#npop-prev a{color:var(--acc)}
#npop-prev strong{font-weight:700}
#npop-prev em{font-style:italic}
#npop-prev br{display:block;margin:3px 0}
.npop-empty{color:var(--mut);font-style:italic;font-size:.8rem}
/* ── Settings panel ── */
#sett{position:fixed;inset:0;z-index:150;pointer-events:none}
#sett.open{pointer-events:all}
#sett-bg{position:absolute;inset:0;background:rgba(0,0,0,.25);opacity:0;transition:opacity .2s}
#sett.open #sett-bg{opacity:1}
#sett-pnl{position:absolute;top:0;right:0;bottom:0;width:310px;max-width:92vw;background:var(--sur);border-left:1px solid var(--bdr);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s;box-shadow:-4px 0 20px rgba(0,0,0,.08)}
#sett.open #sett-pnl{transform:none}
.sph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.sph h2{font-size:.95rem;font-weight:700}
.sph-x{background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--mut);padding:3px 5px;border-radius:4px;line-height:1}.sph-x:hover{color:var(--txt)}
.spbody{padding:16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:20px}
.sp-sec h3{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:9px}
.sp-row{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.sp-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.sp-in{flex:1;background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--rs);color:var(--txt);font-family:inherit;font-size:.8rem;padding:4px 8px;outline:none}.sp-in:focus{border-color:var(--acc)}
.sp-del{background:none;border:none;color:var(--mut);cursor:pointer;font-size:.75rem;padding:2px 4px;border-radius:3px;line-height:1}.sp-del:hover{color:var(--red)}
.sp-add{background:none;border:1px dashed var(--bdr);color:var(--mut);border-radius:var(--rs);padding:4px 9px;font-size:.75rem;font-family:inherit;cursor:pointer;width:100%;margin-top:2px;transition:all .1s}.sp-add:hover{border-color:var(--acc);color:var(--acc)}
.sp-sub{font-size:.72rem;color:var(--mut);line-height:1.5}
/* ── Toast ── */
#toast{position:fixed;bottom:16px;right:16px;background:#1e293b;border-radius:var(--rs);padding:7px 13px;font-size:.79rem;font-weight:600;color:#fff;transform:translateY(12px);opacity:0;transition:all .18s;z-index:500;pointer-events:none}
#toast.show{opacity:1;transform:none}
/* Drag ghost */
.drag-ghost{position:fixed;opacity:.82;pointer-events:none;z-index:9999;transform:rotate(1deg) scale(1.02);box-shadow:0 8px 28px rgba(0,0,0,.14);border-radius:var(--rs);transition:none}
.st-drag-ghost{position:fixed;opacity:.8;pointer-events:none;z-index:9998;background:var(--sur);border:1px solid var(--bdr);border-radius:4px;box-shadow:var(--sh);transition:none;display:flex;align-items:center;gap:5px;padding:3px 7px;font-size:.77rem;white-space:nowrap;overflow:hidden;max-width:260px}
/* Column drag */
.col.col-drag-src{opacity:.25;pointer-events:none}
.col-drag-ghost{position:fixed;opacity:.75;pointer-events:none;z-index:9997;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:0 12px 40px rgba(0,0,0,.18);transition:none;overflow:hidden}
.col.col-dhi-before{box-shadow:-3px 0 0 var(--acc)}
.col.col-dhi-after{box-shadow:3px 0 0 var(--acc)}
.ch{cursor:grab}
/* Column header interactive children override grab cursor */
.ch .ctitle{cursor:text}
.ch .cdel,.ch .cdot,.ch .ccount{cursor:pointer}
/* Note popover progress */
#npop-prog{padding:8px 12px 6px;border-bottom:1px solid var(--bdr);display:none;flex-shrink:0}
#npop-prog.visible{display:block}
.npop-prog-wrap{display:flex;align-items:center;gap:8px}
.npop-prog-label{font-size:.67rem;font-weight:600;color:var(--mut);white-space:nowrap}
#npop-prog-range{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;outline:none;cursor:pointer;opacity:.75}
#npop-prog-range::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#fff;border:1.5px solid var(--mut);cursor:pointer;transition:border-color .1s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
#npop-prog-range::-webkit-slider-thumb:hover{border-color:var(--acc);opacity:1}
#npop-prog-pct{font-size:.72rem;font-weight:700;min-width:28px;text-align:right}
@media(max-width:580px){:root{--cw:270px}header{padding:8px 11px;gap:6px}#hfile{display:none}#board{padding:10px;gap:10px}}
</style>
</head>
<body>

<header>
  <span id="btitle">🗂 My Board</span>
  <input id="btitle-in" type="text" maxlength="40">
  <span id="hfile"></span>
  <span class="hsp"></span>
  <span id="sstatus"></span>
  <button class="hbtn" id="hdr-link">📎 Link file</button>
  <button class="hbtn" id="hdr-saveas">💾 Save As</button>
  <button class="hbtn" id="hdr-sett">⚙</button>
</header>

<div id="filter-bar">
  <span class="fb-label">Filter:</span>
  <button class="filter-btn" id="filter-later" title="Show only subtasks marked as Later">⏱ Later</button>
</div>

<div id="ls-warn">
  <span id="ls-warn-msg"></span>
  <button id="ls-warn-x">✕</button>
</div>

<div id="board">
  <div class="acol-wrap" id="acol-wrap">
    <button class="acol-btn" id="acol-btn"><span style="font-size:1.3rem">＋</span>Add Column</button>
    <div class="acol-form" id="acol-form">
      <input id="ncol-name" placeholder="Column name…" maxlength="30">
      <div>
        <div style="font-size:.68rem;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px">Color</div>
        <div class="crow" id="ccrow"></div>
      </div>
      <div style="display:flex;gap:5px">
        <button class="btn bp" style="flex:1;padding:6px 9px;font-size:.8rem" id="ccol-ok">Add</button>
        <button class="btn bg" style="padding:6px 9px;font-size:.8rem" id="ccol-no">✕</button>
      </div>
    </div>
  </div>
</div>

<!-- Note popover (global singleton) -->
<div id="npop">
  <div class="npop-head">
    <span class="npop-label">Note</span>
    <button class="npop-clr" id="npop-clr" title="Clear note">🗑 Clear</button>
    <button class="npop-x" onclick="closeNote()">✕</button>
  </div>
  <div id="npop-prog">
    <div class="npop-prog-wrap">
      <span class="npop-prog-label">Progress</span>
      <input type="range" id="npop-prog-range" min="0" max="100" value="0">
      <span id="npop-prog-pct">0%</span>
    </div>
  </div>
  <div id="npop-body">
    <textarea id="npop-ta" placeholder="Write a note… (Markdown supported, Cmd+Enter to close)"></textarea>
    <div id="npop-prev"></div>
  </div>
</div>

<!-- Settings panel -->
<div id="sett">
  <div id="sett-bg"></div>
  <div id="sett-pnl">
    <div class="sph">
      <h2>⚙ Settings</h2>
      <button class="sph-x" id="sett-close">✕</button>
    </div>
    <div class="spbody">
      <div class="sp-sec">
        <h3>Labels</h3>
        <div id="sp-labels"></div>
      </div>
      <div class="sp-sec">
        <h3>Statuses</h3>
        <div id="sp-statuses"></div>
        <button class="sp-add" id="sp-add-status">＋ Add status</button>
      </div>
      <div class="sp-sec">
        <h3>Progress mode</h3>
        <p class="sp-sub">Auto: derive % from subtask completion.</p>
        <div style="display:flex;gap:7px;margin-top:8px">
          <button class="btn bg" style="flex:1;font-size:.78rem;padding:6px" id="prog-manual">Manual</button>
          <button class="btn bg" style="flex:1;font-size:.78rem;padding:6px" id="prog-auto">Auto (subtasks)</button>
        </div>
      </div>
      <div class="sp-sec">
        <h3>Subtask ordering</h3>
        <p class="sp-sub">Auto-sort: done, delegated, later &amp; skipped sink to bottom on state change.</p>
        <div style="display:flex;gap:7px;margin-top:8px">
          <button class="btn bg" style="flex:1;font-size:.78rem;padding:6px" id="sort-manual">Manual</button>
          <button class="btn bg" style="flex:1;font-size:.78rem;padding:6px" id="sort-auto">Auto-sort</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

// ── Constants ──────────────────────────────────────────────────
const COLORS = ['#6c63ff','#a78bfa','#38bdf8','#34d399','#fbbf24','#f97316','#ef4444','#ec4899','#64748b'];
const ST_ICON = {null:'◻',done:'✓',inprogress:'●',delegated:'›',outofscope:'✕',later:'L'};
const ST_MENU = [
  ['inprogress','●','In progress'],
  ['delegated', '›','Delegated'],
  ['outofscope','✕','Did not do'],
  ['later',     'L','Later'],
];
// Sort order: active work first, then done/delegated, later, outofscope last
const ST_SORT = {null:0,inprogress:1,done:2,delegated:3,later:4,outofscope:5};
function autoSortCard(card){
  if(!S.autoSortSubtasks) return;
  card.subtasks.sort((a,b)=>(ST_SORT[a.state||'null']??0)-(ST_SORT[b.state||'null']??0));
}
const DEFAULT_LABELS = [
  {name:'Purple',color:'#6c63ff',bg:'#ede9fe',fg:'#4f46e5'},
  {name:'Blue',  color:'#38bdf8',bg:'#dbeafe',fg:'#1d4ed8'},
  {name:'Green', color:'#34d399',bg:'#dcfce7',fg:'#15803d'},
  {name:'Yellow',color:'#fbbf24',bg:'#fef9c3',fg:'#a16207'},
  {name:'Red',   color:'#ef4444',bg:'#fee2e2',fg:'#b91c1c'},
  {name:'Pink',  color:'#ec4899',bg:'#fce7f3',fg:'#be185d'},
];
const DEFAULT_STATUSES = ['Not started','In progress','Blocked','Complete'];

// ── State ──────────────────────────────────────────────────────
let S = mkDefault();
let fileHandle = null;
let saveTimer  = null;
let drag       = null;   // card drag
let stDrag     = null;   // subtask drag
let noteCtx    = null;   // { id, type, obj, anchorEl }
let noteMode   = 'view'; // 'view' | 'edit'
let noteSaveTimer = null;
let newColColor = COLORS[0];
let colDrag    = null;   // column drag state
let activeFilter = null; // null | 'later'

function mkDefault() {
  return {
    v:2, title:'My Board',
    labels: JSON.parse(JSON.stringify(DEFAULT_LABELS)),
    statuses: [...DEFAULT_STATUSES],
    progressMode:'auto',
    autoSortSubtasks:true,
    columns:[
      {id:uid(),name:'Backlog',    color:'#64748b',cards:[]},
      {id:uid(),name:'To Do',     color:'#6c63ff',cards:[]},
      {id:uid(),name:'In Progress',color:'#fbbf24',cards:[]},
      {id:uid(),name:'Done',      color:'#34d399',cards:[]},
    ]
  };
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// ── IndexedDB ──────────────────────────────────────────────────
const IDB={
  _p:null,
  db(){ if(!this._p) this._p=new Promise((res,rej)=>{ const r=indexedDB.open('kanban5',1); r.onupgradeneeded=e=>e.target.result.createObjectStore('kv'); r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e.target.error); }); return this._p; },
  async get(k){ const db=await this.db(); return new Promise((res,rej)=>{ const r=db.transaction('kv','readonly').objectStore('kv').get(k); r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e.target.error); }); },
  async set(k,v){ const db=await this.db(); return new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=res; tx.onerror=e=>rej(e.target.error); }); },
  async del(k){ const db=await this.db(); return new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete=res; tx.onerror=rej; }); }
};

// ── localStorage ───────────────────────────────────────────────
function lsSave(){
  const json=JSON.stringify(S); // minified — no spacing
  try{ localStorage.setItem('kanban5',json); checkLSSize(json); }
  catch(e){ setStatus('ss-err','⚠ Storage full!'); showLSWarn('🚨 localStorage FULL — data NOT saved! Use Save As immediately.','crit'); }
}
function lsLoad(){ try{ const d=localStorage.getItem('kanban5'); if(d){ S=JSON.parse(d); migrate(); return true; } } catch{} return false; }

function migrate(){
  if(!S.labels) S.labels=JSON.parse(JSON.stringify(DEFAULT_LABELS));
  if(!S.statuses) S.statuses=[...DEFAULT_STATUSES];
  if(!S.progressMode) S.progressMode='manual';
  if(!('autoSortSubtasks' in S)) S.autoSortSubtasks=true;
  for(const col of S.columns){
    for(const c of col.cards){
      if(!c.subtasks) c.subtasks=[];
      if(c.progress==null) c.progress=0;
      if(c.status==null) c.status=null;
      if(c.label==null) c.label=null;
      if(c.note==null) c.note='';
      for(const st of c.subtasks){
        if(st.note==null) st.note='';
        if(!('state' in st)) st.state = st.done ? 'done' : null;
        if(st.progress==null) st.progress=0;
      }
    }
  }
}

// ── localStorage size warning ───────────────────────────────────
function checkLSSize(json){
  const bytes=new Blob([json]).size;
  const limit=5*1024*1024;
  const pct=bytes/limit;
  const kb=(bytes/1024).toFixed(1);
  if(pct>=0.9) showLSWarn(`🚨 Storage ${Math.round(pct*100)}% full (${kb}KB / 5MB) — export a backup now!`,'crit');
  else if(pct>=0.7) showLSWarn(`⚠ Storage ${Math.round(pct*100)}% full (${kb}KB / 5MB). Link a .board file as backup.`,'warn');
  else hideLSWarn();
}
function showLSWarn(msg,cls){
  const el=document.getElementById('ls-warn');
  document.getElementById('ls-warn-msg').textContent=msg;
  el.className=cls; el.style.display='flex';
}
function hideLSWarn(){ document.getElementById('ls-warn').style.display='none'; }
document.getElementById('ls-warn-x').onclick=hideLSWarn;

// ── File I/O ───────────────────────────────────────────────────
const FS='showOpenFilePicker' in window;
async function fileRead(h){ return (await h.getFile()).text(); }
async function fileWrite(h,t){ const w=await h.createWritable(); await w.write(t); await w.close(); }
async function checkPerm(h){ if((await h.queryPermission({mode:'readwrite'}))==='granted') return true; return (await h.requestPermission({mode:'readwrite'}))==='granted'; }

async function tryAutoLink(lsWasEmpty){
  if(!FS) return;
  try{
    const h=await IDB.get('fh'); if(!h) return;
    await h.getFile();
    const perm=await h.queryPermission({mode:'readwrite'});
    if(perm==='granted'){
      fileHandle=h; setHFile(h.name);
      if(lsWasEmpty){
        try{
          const loaded=JSON.parse(await fileRead(h));
          if(loaded.v&&loaded.columns){ S=loaded; migrate(); lsSave(); render(); document.getElementById('btitle').textContent='🗂 '+S.title; setStatus('ss-ok','✓ Loaded from file'); return; }
        } catch{}
      }
      await fileWrite(h,JSON.stringify(S,null,2));
      setStatus('ss-ok','✓ Synced');
    } else { setHFile(h.name,true); }
  } catch{ try{ await IDB.del('fh'); } catch{} }
}

// ── Save ───────────────────────────────────────────────────────
function setStatus(cls,msg){ const e=document.getElementById('sstatus'); e.className=cls; e.textContent=msg; }
function dirty(){
  setStatus('ss-ing','● Saving…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    lsSave();
    if(fileHandle){
      try{ await fileWrite(fileHandle,JSON.stringify(S,null,2)); setStatus('ss-ok','✓ Saved'); }
      catch(e){ setStatus('ss-err','⚠ File error'); toast('Write failed: '+e.message); }
    } else { setStatus('ss-ok','✓ Saved (local)'); }
  },500);
}

// ── Header ──────────────────────────────────────────────────────
function setHFile(name,needsReconnect=false){
  const el=document.getElementById('hfile');
  if(name) el.innerHTML=needsReconnect
    ? `<span style="color:var(--mut);font-size:.68rem">🔗 <code>${esc(name)}</code> <button onclick="reconnectFile()" style="background:none;border:none;color:var(--acc);cursor:pointer;font-size:.68rem;font-weight:700">Reconnect</button></span>`
    : `<code>${esc(name)}</code>`;
  else el.innerHTML='<span style="font-style:italic;font-size:.7rem">local only</span>';
}
window.reconnectFile=async()=>{ try{ const h=await IDB.get('fh'); if(!h) return; if(!await checkPerm(h)){toast('Permission denied');return;} fileHandle=h; setHFile(h.name); dirty(); } catch(e){toast(e.message);} };

document.getElementById('hdr-link').onclick=async()=>{
  if(!FS){toast('File System API not supported');return;}
  try{
    const [h]=await showOpenFilePicker({types:[{description:'Board file',accept:{'application/json':['.board','.json']}}]});
    if(!await checkPerm(h)){toast('Permission denied');return;}
    try{ const loaded=JSON.parse(await fileRead(h)); if(loaded.v&&loaded.columns){S=loaded;migrate();} } catch{}
    fileHandle=h; await IDB.set('fh',h); setHFile(h.name); dirty(); render(); toast('Linked to '+h.name);
  } catch(e){if(e.name!=='AbortError') toast(e.message);}
};
document.getElementById('hdr-saveas').onclick=async()=>{
  const json=JSON.stringify(S,null,2);
  if(!FS){ const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([json],{type:'application/json'})),download:'board.board'}); a.click(); toast('Downloaded board.board'); return; }
  try{
    const h=await showSaveFilePicker({suggestedName:'board.board',types:[{description:'Board file',accept:{'application/json':['.board','.json']}}]});
    await fileWrite(h,json); fileHandle=h; await IDB.set('fh',h); setHFile(h.name); setStatus('ss-ok','✓ Saved'); toast('Saved as '+h.name);
  } catch(e){if(e.name!=='AbortError') toast(e.message);}
};

// ── Board title ────────────────────────────────────────────────
document.getElementById('btitle').onclick=()=>{ const i=document.getElementById('btitle-in'); i.value=S.title; document.getElementById('btitle').style.display='none'; i.style.display='block'; i.focus(); i.select(); };
function commitTitle(){ const i=document.getElementById('btitle-in'); const v=i.value.trim(); if(v) S.title=v; i.style.display='none'; const h=document.getElementById('btitle'); h.style.display=''; h.textContent='🗂 '+S.title; dirty(); }
document.getElementById('btitle-in').addEventListener('blur',commitTitle);
document.getElementById('btitle-in').addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();commitTitle();} if(e.key==='Escape'){document.getElementById('btitle-in').style.display='none';document.getElementById('btitle').style.display='';} });

// ── Settings ───────────────────────────────────────────────────
const settEl=document.getElementById('sett');
document.getElementById('hdr-sett').onclick=openSett;
document.getElementById('sett-close').onclick=closeSett;
document.getElementById('sett-bg').onclick=closeSett;
function openSett(){ renderSett(); settEl.classList.add('open'); }
function closeSett(){ settEl.classList.remove('open'); }
function renderSett(){
  const lb=document.getElementById('sp-labels'); lb.innerHTML='';
  S.labels.forEach((lbl,i)=>{
    const row=document.createElement('div'); row.className='sp-row';
    row.innerHTML=`<span class="sp-dot" style="background:${lbl.color}"></span><input class="sp-in" value="${esc(lbl.name)}"><span style="background:${lbl.bg};color:${lbl.fg};font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:12px">${esc(lbl.name)}</span>`;
    const inp=row.querySelector('input');
    inp.addEventListener('input',()=>{ S.labels[i].name=inp.value; row.querySelector('span:last-child').textContent=inp.value; dirty(); });
    lb.appendChild(row);
  });
  const sb=document.getElementById('sp-statuses'); sb.innerHTML='';
  S.statuses.forEach((st,i)=>{
    const row=document.createElement('div'); row.className='sp-row';
    row.innerHTML=`<input class="sp-in" value="${esc(st)}"><button class="sp-del">✕</button>`;
    row.querySelector('input').addEventListener('input',e=>{ S.statuses[i]=e.target.value; dirty(); });
    row.querySelector('button').onclick=()=>{ if(S.statuses.length<=1){toast('Need at least 1 status');return;} S.statuses.splice(i,1); for(const col of S.columns) for(const c of col.cards) if(c.status!=null&&c.status>=i) c.status=Math.max(0,c.status-1); dirty(); renderSett(); render(); };
    sb.appendChild(row);
  });
  document.getElementById('prog-manual').classList.toggle('bp',S.progressMode==='manual');
  document.getElementById('prog-manual').classList.toggle('bg',S.progressMode!=='manual');
  document.getElementById('prog-auto').classList.toggle('bp',S.progressMode==='auto');
  document.getElementById('prog-auto').classList.toggle('bg',S.progressMode!=='auto');
  document.getElementById('sort-manual').classList.toggle('bp',!S.autoSortSubtasks);
  document.getElementById('sort-manual').classList.toggle('bg',!!S.autoSortSubtasks);
  document.getElementById('sort-auto').classList.toggle('bp',!!S.autoSortSubtasks);
  document.getElementById('sort-auto').classList.toggle('bg',!S.autoSortSubtasks);
}
document.getElementById('sp-add-status').onclick=()=>{ S.statuses.push('New status'); dirty(); renderSett(); render(); };
document.getElementById('prog-manual').onclick=()=>{ S.progressMode='manual'; dirty(); renderSett(); render(); };
document.getElementById('prog-auto').onclick=()=>{ S.progressMode='auto'; dirty(); renderSett(); render(); };
document.getElementById('sort-manual').onclick=()=>{ S.autoSortSubtasks=false; dirty(); renderSett(); render(); };
document.getElementById('sort-auto').onclick=()=>{ S.autoSortSubtasks=true; dirty(); renderSett(); render(); };

// ── Add column ─────────────────────────────────────────────────
const ccrow=document.getElementById('ccrow');
COLORS.forEach((c,i)=>{ const sw=document.createElement('span'); sw.className='csw'+(i===0?' sel':''); sw.style.background=c; sw.onclick=()=>{ newColColor=c; ccrow.querySelectorAll('.csw').forEach((s,j)=>s.classList.toggle('sel',j===i)); }; ccrow.appendChild(sw); });
document.getElementById('acol-btn').onclick=()=>{ document.getElementById('acol-btn').style.display='none'; document.getElementById('acol-form').classList.add('open'); document.getElementById('ncol-name').focus(); };
document.getElementById('ccol-no').onclick=closeColForm;
document.getElementById('ccol-ok').onclick=submitCol;
document.getElementById('ncol-name').addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();submitCol();} if(e.key==='Escape') closeColForm(); });
function closeColForm(){ document.getElementById('acol-form').classList.remove('open'); document.getElementById('ncol-name').value=''; document.getElementById('acol-btn').style.display=''; }
function submitCol(){ const n=document.getElementById('ncol-name').value.trim(); if(!n) return; S.columns.push({id:uid(),name:n,color:newColColor,cards:[]}); closeColForm(); dirty(); render(); toast('Column added'); }

// ── Progress color helpers ─────────────────────────────────────
function progressColor(v){
  v=Math.max(0,Math.min(100,v||0));
  if(v<=50){ const t=v/50; return `rgb(${Math.round(239+(251-239)*t)},${Math.round(68+(191-68)*t)},${Math.round(68+(36-68)*t)})`; }
  const t=(v-50)/50; return `rgb(${Math.round(251+(34-251)*t)},${Math.round(191+(197-191)*t)},${Math.round(36+(94-36)*t)})`;
}
function setRangeGradient(el,v){
  v=Math.max(0,Math.min(100,v||0));
  if(!v){el.style.background='var(--bdr)';return;}
  const stops=v<=50
    ?`#ef4444 0%,#fbbf24 ${v}%,var(--bdr) ${v}%,var(--bdr) 100%`
    :`#ef4444 0%,#fbbf24 50%,#22c55e ${v}%,var(--bdr) ${v}%,var(--bdr) 100%`;
  el.style.background=`linear-gradient(to right,${stops})`;
}

// ── Scroll preservation ────────────────────────────────────────
function saveScroll(){ const m={}; document.querySelectorAll('.cards[data-col]').forEach(el=>{m[el.dataset.col]=el.scrollTop;}); return m; }
function restoreScroll(m){ requestAnimationFrame(()=>document.querySelectorAll('.cards[data-col]').forEach(el=>{ if(m[el.dataset.col]!=null) el.scrollTop=m[el.dataset.col]; })); }
function renderPS(){ const m=saveScroll(); render(); restoreScroll(m); } // render, preserving scroll

// ── Render ─────────────────────────────────────────────────────
function render(){
  const board=document.getElementById('board');
  const wrap=document.getElementById('acol-wrap');
  board.querySelectorAll('.col').forEach(el=>el.remove());
  document.getElementById('btitle').textContent='🗂 '+S.title;
  for(const col of S.columns) board.insertBefore(buildCol(col),wrap);
}

function colProg(col){
  if(!col.cards.length) return null;
  return Math.round(col.cards.map(c=>effProg(c)).reduce((a,b)=>a+b,0)/col.cards.length);
}
function effProg(card){
  if(S.progressMode==='auto'&&card.subtasks.length>0){
    const total=card.subtasks.reduce((sum,s)=>{
      const terminal=s.state==='done'||s.state==='delegated'||s.state==='outofscope'||s.state==='later';
      return sum+(terminal?100:(s.progress||0));
    },0);
    return Math.round(total/card.subtasks.length);
  }
  return card.progress||0;
}

function buildCard(card,col,filter){

  el.innerHTML=`
    <div class="cact">

    <div class="subtasks" id="st-${card.id}"></div>
    <div class="add-stask-row">
      <input id="stinp-${card.id}" placeholder="Add subtask…" maxlength="200">

      ${lbl?`<span class="clabel" style="background:${lbl.bg};color:${lbl.fg}" data-cycle-lbl="${card.id}">${esc(lbl.name)}</span>`:''}
      <span class="cstatus${st?' ':' '}" style="${!st?'opacity:.45':''}" data-cycle-st="${card.id}">${esc(st||'Set status')}</span>

          <button class="pc" data-pp="${card.id}" data-delta="-10">−10</button>
          <button class="pc" data-pp="${card.id}" data-delta="-5">−5</button>
          <button class="pc" data-pp="${card.id}" data-delta="5">+5</button>
          <button class="pc" data-pp="${card.id}" data-delta="10">+10</button>
        </div>`:''}
      </div>
    </div>
    <div class="cstrip"><div class="cstrip-fill" style="width:${pct}%"></div></div>`;

  // Subtasks (filtered if activeFilter)
  const stCont=el.querySelector(`#st-${card.id}`);
  const stShow=filter==='later'?card.subtasks.filter(s=>s.state==='later'):card.subtasks;
  stShow.forEach(st=>stCont.appendChild(buildSubtask(st,card)));

  el.addEventListener('pointerdown',e=>onPD(e,el,card,col));
  return el;
}

function buildSubtask(st,card){
  const el=document.createElement('div');
  el.className='stask';
  el.dataset.stId=st.id;
  el.dataset.state=st.state||'null';

  // Main row
  const row=document.createElement('div'); row.className='stask-row';

  // Drag handle
  const handle=document.createElement('span');
  handle.className='st-handle'; handle.textContent='⠿';
  handle.addEventListener('pointerdown',e=>{ e.stopPropagation(); e.preventDefault(); startStDrag(e,el,st,card); });

  // State button + hover menu
  const wrap=document.createElement('span'); wrap.className='st-state-wrap';
  const stBtn=document.createElement('button'); stBtn.className='st-state-btn';
  stBtn.dataset.state=st.state||'null';
  stBtn.textContent=ST_ICON[st.state]||ST_ICON.null;
  stBtn.title='Click to toggle done';
  stBtn.addEventListener('click',e=>{
    e.stopPropagation();
    st.state=(st.state==='done')?null:'done';
    if(st.state==='done') st.progress=100;
    autoSortCard(card);
    dirty(); renderPS();
  });
  stBtn.addEventListener('pointerdown',e=>e.stopPropagation());

  const menu=document.createElement('div'); menu.className='st-mini-menu';
  ST_MENU.forEach(([state,icon,tip])=>{
    const btn=document.createElement('button'); btn.className='st-mm-btn'+(st.state===state?' active':'');
    btn.dataset.target=state; btn.textContent=icon; btn.title=tip;
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      st.state=(st.state===state)?null:state;
      if(st.state==='done') st.progress=100;
      autoSortCard(card);
      dirty(); renderPS();
    });
    btn.addEventListener('pointerdown',e=>e.stopPropagation());
    menu.appendChild(btn);
  });
  wrap.appendChild(stBtn); wrap.appendChild(menu);

  // Label
  const lbl=document.createElement('span'); lbl.className='st-lbl'; lbl.textContent=st.text;
  lbl.contentEditable='true'; lbl.spellcheck=false;
  lbl.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();lbl.blur();} if(e.key==='Escape'){lbl.textContent=st.text;lbl.blur();} });
  lbl.addEventListener('blur',()=>{ const v=lbl.textContent.trim(); if(v) st.text=v; else lbl.textContent=st.text; dirty(); });
  lbl.addEventListener('pointerdown',e=>e.stopPropagation());

  const noteBtn=mkNoteBtn(st.id,'subtask',()=>st.note);
  noteBtn.addEventListener('pointerdown',e=>e.stopPropagation());

  const del=document.createElement('button'); del.className='st-del'; del.textContent='✕';
  del.addEventListener('click',e=>{ e.stopPropagation(); const c=findCard(card.id).card; if(!c) return; c.subtasks=c.subtasks.filter(s=>s.id!==st.id); dirty(); renderPS(); });

  row.appendChild(handle); row.appendChild(wrap); row.appendChild(lbl); row.appendChild(noteBtn); row.appendChild(del);
  el.appendChild(row);

  // Progress bar row (always shown; fill + % only when > 0)
  const progRow=document.createElement('div'); progRow.className='st-prog-row';
  const bar=document.createElement('div'); bar.className='st-prog-bar';
  const fill=document.createElement('div'); fill.className='st-prog-fill';
  const pv=st.progress||0;
  fill.style.width=pv+'%';
  if(pv>0) fill.style.backgroundColor=progressColor(pv);
  bar.appendChild(fill);
  const pct=document.createElement('span'); pct.className='st-prog-pct';
  if(pv>0){ pct.textContent=pv+'%'; pct.style.color=progressColor(pv); } else pct.textContent='';
  progRow.appendChild(bar); progRow.appendChild(pct);
  el.appendChild(progRow);

  return el;
}

// ── Note button factory ──────────────────────────────────────
function mkNoteBtn(id,type,getNote){
  const btn=document.createElement('button');
  btn.className='note-btn'+(getNote()?' has-note':'');
  btn.dataset.noteId=id; btn.dataset.noteType=type;
  btn.textContent='📝';
  btn.addEventListener('click',e=>{ e.stopPropagation(); openNote(id,type,btn); });
  return btn;
}

function clearNote(id,type){
  if(type==='card'){ const {card}=findCard(id); if(card){card.note='';dirty();} }
  else{ for(const col of S.columns) for(const c of col.cards){ const st=c.subtasks.find(s=>s.id===id); if(st){st.note='';dirty();return;} } }
}

// ── Note popover ───────────────────────────────────────────────
function openNote(id,type,anchorEl){
  let obj=null;
  if(type==='card'){ const r=findCard(id); obj=r.card; }
  else{ outer:for(const col of S.columns) for(const c of col.cards){ const st=c.subtasks.find(s=>s.id===id); if(st){obj=st;break outer;} } }
  if(!obj) return;

  if(noteCtx) saveNoteNow();
  noteCtx={id,type,obj,anchorEl};

  const ta=document.getElementById('npop-ta');
  const pv=document.getElementById('npop-prev');
  const pop=document.getElementById('npop');
  ta.value=obj.note||'';

  const hasNote=!!(obj.note&&obj.note.trim());
  if(hasNote){
    // View mode: preview only, narrow
    noteMode='view';
    pop.classList.remove('wide');
    ta.style.display='none';
    pv.innerHTML=renderMd(obj.note)||'<p class="npop-empty">Empty note</p>';
  } else {
    // Edit mode: empty note → show split immediately
    noteMode='edit';
    pop.classList.add('wide');
    ta.style.display='block';
    pv.innerHTML='<p class="npop-empty">Preview…</p>';
  }

  // Show/hide progress slider for subtask notes
  const progEl=document.getElementById('npop-prog');
  const progRange=document.getElementById('npop-prog-range');
  const progPct=document.getElementById('npop-prog-pct');
  if(type==='subtask'){
    progEl.classList.add('visible');
    const pv=obj.progress||0;
    progRange.value=pv;
    progPct.textContent=pv+'%';
    progPct.style.color=pv>0?progressColor(pv):'var(--mut)';
    setRangeGradient(progRange,pv);
  } else {
    progEl.classList.remove('visible');
  }

  pop.style.display='flex';
  requestAnimationFrame(()=>positionNote(anchorEl,pop,noteMode==='edit'?580:300));
  if(noteMode==='edit') setTimeout(()=>ta.focus(),60);
  setTimeout(()=>document.addEventListener('pointerdown',onNoteOutside),0);
}

function positionNote(anchorEl,pop,wantW){
  const r=anchorEl.getBoundingClientRect();
  const pw=wantW||pop.offsetWidth||300;
  const ph=pop.offsetHeight||240;
  const gap=8;
  let left,top;
  if(r.right+gap+pw<=window.innerWidth-gap) left=r.right+gap;
  else left=r.left-pw-gap;
  left=Math.max(gap,Math.min(left,window.innerWidth-pw-gap));
  top=r.top;
  if(top+ph>window.innerHeight-gap) top=window.innerHeight-ph-gap;
  if(top<gap) top=gap;
  pop.style.left=left+'px'; pop.style.top=top+'px';
}

function enterEditMode(){
  if(noteMode==='edit') return;
  noteMode='edit';
  const pop=document.getElementById('npop');
  const ta=document.getElementById('npop-ta');
  pop.classList.add('wide');
  ta.style.display='block';
  if(noteCtx) positionNote(noteCtx.anchorEl,pop,580);
  setTimeout(()=>ta.focus(),20);
}

function onNoteOutside(e){
  const pop=document.getElementById('npop');
  if(pop.contains(e.target)) return;
  closeNote();
}

function closeNote(){
  saveNoteNow();
  document.getElementById('npop').style.display='none';
  document.removeEventListener('pointerdown',onNoteOutside);
  noteCtx=null;
}

function saveNoteNow(){
  if(!noteCtx) return;
  clearTimeout(noteSaveTimer);
  const ta=document.getElementById('npop-ta');
  const newNote=ta.value;
  noteCtx.obj.note=newNote;
  // Update button state in place (no full re-render needed)
  const btn=document.querySelector(`.note-btn[data-note-id="${noteCtx.id}"]`);
  if(btn){ btn.classList.toggle('has-note',!!newNote); btn.textContent='📝'; btn._delMode=false; }
  dirty();
}

document.getElementById('npop-ta').addEventListener('input',()=>{
  clearTimeout(noteSaveTimer);
  noteSaveTimer=setTimeout(saveNoteNow,800);

  const html=renderMd(document.getElementById('npop-ta').value);

document.getElementById('npop-prev').addEventListener('click',()=>enterEditMode());
document.getElementById('npop-prog-range').addEventListener('input',()=>{

  const pct=document.getElementById('npop-prog-pct');
  const v=parseInt(el.value);

    noteCtx.obj.progress=v;

    if(stEl){
      const fill=stEl.querySelector('.st-prog-fill');

      if(pctEl){pctEl.textContent=v>0?v+'%':'';pctEl.style.color=v>0?progressColor(v):'';}
    }
  }
});

// ── Markdown renderer ──────────────────────────────────────────
function renderMd(raw){
  if(!raw||!raw.trim()) return '';
  const inl=s=>{
    let r=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    r=r.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    r=r.replace(/\*(.+?)\*/g,'<em>$1</em>');
    r=r.replace(/`(.+?)`/g,'<code>$1</code>');
    r=r.replace(/\[(.+?)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    return r;
  };
  const out=[]; let inUl=false,inOl=false;
  const closeList=()=>{ if(inUl){out.push('</ul>');inUl=false;} if(inOl){out.push('</ol>');inOl=false;} };
  for(const line of raw.split('\n')){
    const hm=line.match(/^(#{1,3})\s+(.+)$/); if(hm){ closeList(); out.push(`<h${hm[1].length}>${inl(hm[2])}</h${hm[1].length}>`); continue; }
    const ulm=line.match(/^[-*]\s+(.+)$/); if(ulm){ if(!inUl){closeList();out.push('<ul>');inUl=true;} out.push(`<li>${inl(ulm[1])}</li>`); continue; }
    const olm=line.match(/^\d+\.\s+(.+)$/); if(olm){ if(!inOl){closeList();out.push('<ol>');inOl=true;} out.push(`<li>${inl(olm[1])}</li>`); continue; }
    const bq=line.match(/^>\s+(.+)$/); if(bq){ closeList(); out.push(`<blockquote>${inl(bq[1])}</blockquote>`); continue; }
    if(!line.trim()){ closeList(); out.push('<br>'); continue; }
    closeList(); out.push(`<p>${inl(line)}</p>`);
  }
  closeList();
  return out.join('');
}

// ── Card drag ──────────────────────────────────────────────────
function onPD(e,cardEl,card,col){
  if(e.target.closest('.cbtn,.pc,.cstatus,.clabel,.add-stask-row,.stask,.cact,.cstrip,.note-btn')) return;
  if(e.pointerType==='mouse'&&e.button!==0) return;
  e.preventDefault();
  const sx=e.clientX,sy=e.clientY;
  let moved=false,dragStarted=false,ghost=null;

  function cleanup(){ document.removeEventListener('pointermove',onMove); document.removeEventListener('pointerup',onUp); document.removeEventListener('pointercancel',onUp); }
  function onMove(ev){
    const dx=ev.clientX-sx,dy=ev.clientY-sy;
    if(!moved&&Math.hypot(dx,dy)<6) return;
    moved=true;
    if(!dragStarted){
      dragStarted=true;
      const r=cardEl.getBoundingClientRect();
      ghost=cardEl.cloneNode(true);
      ghost.className='card drag-ghost';
      ghost.style.cssText=`width:${r.width}px;left:${r.left}px;top:${r.top}px;`;
      ghost.querySelectorAll('.cact,.add-stask-row,.prog-btns,.note-btn').forEach(x=>x.remove());
      document.body.appendChild(ghost);
      cardEl.classList.add('dsrc');
      drag={cardId:card.id,colId:col.id,cardEl,ghost,ox:ev.clientX-r.left,oy:ev.clientY-r.top};
    }
    if(ghost){ ghost.style.left=(ev.clientX-drag.ox)+'px'; ghost.style.top=(ev.clientY-drag.oy)+'px'; }
    updateDropIndicators(ev.clientX,ev.clientY);
  }
  function onUp(ev){
    cleanup();
    if(ghost){ghost.remove();ghost=null;}
    cardEl.classList.remove('dsrc');
    clearDI();
    if(!moved){ activateCardEdit(cardEl,card); return; }
    if(drag){ const{cardId,colId:fromColId}=drag; drag=null; doDropCard(ev.clientX,ev.clientY,cardId,fromColId); }
  }
  document.addEventListener('pointermove',onMove,{passive:false});
  document.addEventListener('pointerup',onUp);
  document.addEventListener('pointercancel',onUp);
}

function activateCardEdit(cardEl,card){
  if(cardEl.classList.contains('editing')) return;
  cardEl.classList.add('editing');
  const td=cardEl.querySelector('.ctext');
  const ta=document.createElement('textarea'); ta.className='card-edit-ta'; ta.value=card.text;
  cardEl.insertBefore(ta,td); td.style.display='none';
  ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px';
  ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';});
  ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);
  function commit(){ const v=ta.value.trim(); if(v) card.text=v; ta.remove(); td.style.display=''; td.textContent=card.text; cardEl.classList.remove('editing'); dirty(); }
  function cancel(){ ta.remove(); td.style.display=''; cardEl.classList.remove('editing'); }
  ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();commit();} if(e.key==='Escape'){e.preventDefault();cancel();} });
  ta.addEventListener('blur',commit);
  ta.addEventListener('pointerdown',e=>e.stopPropagation());
}

function updateDropIndicators(x,y){
  clearDI();
  const col=findColAtX(x); if(!col) return;
  col.classList.add('drop-hi');
  const cl=col.querySelector('.cards');
  const cards=[...cl.querySelectorAll('.card:not(.dsrc)')];
  let marked=false;
  for(const c of cards){ const r=c.getBoundingClientRect(); if(y<r.top+r.height/2){c.classList.add('dhi-before');marked=true;break;} }
  if(!marked&&cards.length) cards[cards.length-1].classList.add('dhi-after');
}
function findColAtX(x){
  const cols=[...document.querySelectorAll('.col')];
  for(const c of cols){ const r=c.getBoundingClientRect(); if(x>=r.left&&x<=r.right) return c; }
  let best=null,min=Infinity;
  for(const c of cols){ const r=c.getBoundingClientRect(); const d=Math.abs(x-(r.left+r.width/2)); if(d<min){min=d;best=c;} }
  return best;
}
function doDropCard(x,y,cardId,fromColId){
  const colEl=findColAtX(x); if(!colEl) return;
  const toColId=colEl.dataset.colId;
  const cl=colEl.querySelector('.cards');
  const cards=[...cl.querySelectorAll('.card:not(.dsrc)')];
  const fromCol=findCol(fromColId),toCol=findCol(toColId);
  if(!fromCol||!toCol) return;
  const fi=fromCol.cards.findIndex(c=>c.id===cardId); if(fi<0) return;
  const [card]=fromCol.cards.splice(fi,1);
  let insertBefore=null;
  for(const c of cards){ const r=c.getBoundingClientRect(); if(y<r.top+r.height/2){insertBefore=c;break;} }
  if(insertBefore){ const ti=toCol.cards.findIndex(c=>c.id===insertBefore.dataset.cardId); toCol.cards.splice(ti,0,card); }
  else toCol.cards.push(card);
  dirty(); render();
}
function clearDI(){ document.querySelectorAll('.dhi-before,.dhi-after,.drop-hi').forEach(el=>el.classList.remove('dhi-before','dhi-after','drop-hi')); }

// ── Subtask drag ───────────────────────────────────────────────
function startStDrag(e,stEl,st,card){
  e.preventDefault();
  const r=stEl.getBoundingClientRect();
  const ghost=document.createElement('div');
  ghost.className='st-drag-ghost';
  ghost.textContent=st.text;
  ghost.style.cssText=`width:${r.width}px;left:${r.left}px;top:${r.top}px;`;
  document.body.appendChild(ghost);
  stEl.classList.add('st-src');
  stDrag={stId:st.id,cardId:card.id,stEl,ghost,oy:e.clientY-r.top,moved:false};
  document.addEventListener('pointermove',onStMove,{passive:false});
  document.addEventListener('pointerup',onStUp);
  document.addEventListener('pointercancel',onStUp);
}
function onStMove(e){
  if(!stDrag) return; e.preventDefault();
  stDrag.moved=true;
  stDrag.ghost.style.top=(e.clientY-stDrag.oy)+'px';
  const cont=document.getElementById(`st-${stDrag.cardId}`); if(!cont) return;
  cont.querySelectorAll('.stask').forEach(el=>el.classList.remove('st-dhi-before','st-dhi-after'));
  const items=[...cont.querySelectorAll('.stask:not(.st-src)')];
  let marked=false;
  for(const item of items){ const r=item.getBoundingClientRect(); if(e.clientY<r.top+r.height/2){item.classList.add('st-dhi-before');marked=true;break;} }
  if(!marked&&items.length) items[items.length-1].classList.add('st-dhi-after');
}
function onStUp(e){
  if(!stDrag) return;
  const{stId,cardId,stEl,ghost,moved}=stDrag; stDrag=null;
  document.removeEventListener('pointermove',onStMove);
  document.removeEventListener('pointerup',onStUp);
  document.removeEventListener('pointercancel',onStUp);
  ghost.remove(); stEl.classList.remove('st-src');
  const cont=document.getElementById(`st-${cardId}`);
  if(cont) cont.querySelectorAll('.stask').forEach(el=>el.classList.remove('st-dhi-before','st-dhi-after'));
  if(!moved) return;
  const{card}=findCard(cardId); if(!card) return;
  const fi=card.subtasks.findIndex(s=>s.id===stId); if(fi<0) return;
  const[st]=card.subtasks.splice(fi,1);
  // Find insertion point from DOM
  const items=cont?[...cont.querySelectorAll('.stask')]:[];
  let insertBeforeId=null;
  for(const item of items){ const r=item.getBoundingClientRect(); if(e.clientY<r.top+r.height/2){insertBeforeId=item.dataset.stId;break;} }
  if(insertBeforeId){ const ti=card.subtasks.findIndex(s=>s.id===insertBeforeId); card.subtasks.splice(ti>=0?ti:card.subtasks.length,0,st); }
  else card.subtasks.push(st);
  dirty(); render();
}

// ── Column drag ────────────────────────────────────────────────
function onColPD(e,colEl,col){
  if(e.target.closest('.cdot-wrap,.cdel,.ctitle,.ccount')) return;
  if(e.pointerType==='mouse'&&e.button!==0) return;
  e.preventDefault();
  const sx=e.clientX,sy=e.clientY;
  let moved=false,dragStarted=false,ghost=null;
  function cleanup(){ document.removeEventListener('pointermove',onCMove); document.removeEventListener('pointerup',onCUp); document.removeEventListener('pointercancel',onCUp); }
  function onCMove(ev){
    const dx=ev.clientX-sx,dy=ev.clientY-sy;
    if(!moved&&Math.hypot(dx,dy)<8) return;
    moved=true;
    if(!dragStarted){
      dragStarted=true;
      const r=colEl.getBoundingClientRect();
      ghost=document.createElement('div'); ghost.className='col-drag-ghost';
      ghost.style.cssText=`width:${r.width}px;height:${Math.min(r.height,300)}px;left:${r.left}px;top:${r.top}px;`;
      document.body.appendChild(ghost);
      colEl.classList.add('col-drag-src');
      colDrag={colId:col.id,colEl,ghost,ox:ev.clientX-r.left,oy:ev.clientY-r.top};
    }
    if(ghost){ghost.style.left=(ev.clientX-colDrag.ox)+'px';ghost.style.top=(ev.clientY-colDrag.oy)+'px';}
    updateColDI(ev.clientX);
  }
  function onCUp(ev){
    cleanup();
    if(ghost){ghost.remove();ghost=null;}
    colEl.classList.remove('col-drag-src');
    clearColDI();
    if(!moved||!colDrag) return;
    const{colId}=colDrag; colDrag=null;
    doDropCol(ev.clientX,colId);
  }
  document.addEventListener('pointermove',onCMove,{passive:false});
  document.addEventListener('pointerup',onCUp);
  document.addEventListener('pointercancel',onCUp);
}
function updateColDI(x){
  clearColDI();
  const cols=[...document.querySelectorAll('.col:not(.col-drag-src)')];
  let marked=false;
  for(const c of cols){ const r=c.getBoundingClientRect(); if(x<r.left+r.width/2){c.classList.add('col-dhi-before');marked=true;break;} }
  if(!marked&&cols.length) cols[cols.length-1].classList.add('col-dhi-after');
}
function clearColDI(){ document.querySelectorAll('.col-dhi-before,.col-dhi-after').forEach(el=>el.classList.remove('col-dhi-before','col-dhi-after')); }
function doDropCol(x,dragColId){
  const cols=[...document.querySelectorAll('.col:not(.col-drag-src)')];
  const fi=S.columns.findIndex(c=>c.id===dragColId); if(fi<0) return;
  const[col]=S.columns.splice(fi,1);
  let insertBefore=null;
  for(const c of cols){ const r=c.getBoundingClientRect(); if(x<r.left+r.width/2){insertBefore=c.dataset.colId;break;} }
  if(insertBefore){ const ti=S.columns.findIndex(c=>c.id===insertBefore); S.columns.splice(ti>=0?ti:S.columns.length,0,col); }
  else S.columns.push(col);
  dirty(); render();
}

// ── Board event delegation ─────────────────────────────────────
document.getElementById('board').addEventListener('click',e=>{
  const t=e.target;
  const openf=t.closest('[data-openf]'); if(openf){openCF(openf.dataset.openf);return;}
  const closef=t.closest('[data-closef]'); if(closef){closeCF(closef.dataset.closef);return;}
  const addc=t.closest('[data-addc]'); if(addc){submitCard(addc.dataset.addc);return;}
  const dcard=t.closest('[data-dcard]'); if(dcard){delCard(dcard.dataset.dcard);return;}
  const dcol=t.closest('[data-dcol]'); if(dcol){delCol(dcol.dataset.dcol);return;}
  const setcol=t.closest('[data-setcol]');
  if(setcol){ const[colId,color]=setcol.dataset.setcol.split(':'); const col=findCol(colId); if(col){col.color=color;dirty();render();} return; }
  const addst=t.closest('[data-addst]'); if(addst){doAddSubtask(addst.dataset.addst);return;}
  const pp=t.closest('[data-pp]');
  if(pp){ const{card}=findCard(pp.dataset.pp); if(!card) return; if(S.progressMode==='auto'){toast('Progress auto-calculated from subtasks');return;} card.progress=Math.max(0,Math.min(100,(card.progress||0)+parseInt(pp.dataset.delta))); dirty();render(); return; }
  const cst=t.closest('[data-cycle-st]');
  if(cst){ const{card}=findCard(cst.dataset.cycleSt); if(!card) return; card.status=card.status==null?0:(card.status+1)%S.statuses.length; dirty();render(); return; }
  const clbl=t.closest('[data-cycle-lbl]');
  if(clbl){ const{card}=findCard(clbl.dataset.cycleLbl); if(!card) return; card.label=card.label==null?0:card.label>=S.labels.length-1?null:card.label+1; dirty();render(); return; }
});

document.getElementById('board').addEventListener('blur',e=>{
  const el=e.target.closest('[data-ctitle]'); if(!el) return;
  const col=findCol(el.dataset.ctitle); if(!col) return;
  col.name=el.textContent.trim()||col.name; el.textContent=col.name; dirty();
},true);

document.getElementById('board').addEventListener('keydown',e=>{
  const ct=e.target.closest('[data-ctitle]');
  if(ct&&e.key==='Enter'){e.preventDefault();ct.blur();return;}
  if(ct&&e.key==='Escape'){ct.blur();return;}
  const ta=e.target;
  if(ta.tagName==='TEXTAREA'&&ta.closest('.acform')){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const col=ta.closest('.col');if(col)submitCard(col.dataset.colId);}
    if(e.key==='Escape'){const col=ta.closest('.col');if(col)closeCF(col.dataset.colId);}
    return;
  }
  if(ta.tagName==='INPUT'&&ta.closest('.add-stask-row')&&e.key==='Enter'){ const btn=ta.closest('.add-stask-row').querySelector('[data-addst]'); if(btn) doAddSubtask(btn.dataset.addst); return; }
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    const pop=document.getElementById('npop');
    if(pop.style.display!=='none'){closeNote();return;}
    // close settings if open
    if(settEl.classList.contains('open')){closeSett();return;}
  }
});

// ── Card form ──────────────────────────────────────────────────
function openCF(colId){ document.getElementById(`af-${colId}`).classList.add('open'); document.querySelector(`[data-openf="${colId}"]`).style.display='none'; document.getElementById(`ta-${colId}`).focus(); }
function closeCF(colId){ document.getElementById(`af-${colId}`).classList.remove('open'); document.getElementById(`ta-${colId}`).value=''; const lp=document.getElementById(`lp-${colId}`); if(lp){lp._sel=null;lp.querySelectorAll('.ldot').forEach((d,j)=>d.classList.toggle('sel',j===0));} document.querySelector(`[data-openf="${colId}"]`).style.display=''; }
function submitCard(colId){ const ta=document.getElementById(`ta-${colId}`); const txt=ta.value.trim(); if(!txt) return; const lp=document.getElementById(`lp-${colId}`); const col=findCol(colId); if(!col) return; col.cards.push({id:uid(),text:txt,label:lp?._sel??null,status:null,progress:0,subtasks:[],note:''}); closeCF(colId); dirty(); render(); toast('Card added'); }

// ── Subtask helpers ────────────────────────────────────────────
function doAddSubtask(cardId){ const inp=document.getElementById(`stinp-${cardId}`); const txt=inp.value.trim(); if(!txt) return; const{card}=findCard(cardId); if(!card) return; card.subtasks.push({id:uid(),text:txt,state:null,progress:0,note:''}); inp.value=''; dirty(); renderPS(); setTimeout(()=>{ const ni=document.getElementById(`stinp-${cardId}`); if(ni) ni.focus(); },0); }

// ── Mutations ──────────────────────────────────────────────────
function delCard(id){ for(const col of S.columns){const i=col.cards.findIndex(c=>c.id===id);if(i>=0){col.cards.splice(i,1);break;}} dirty();render();toast('Card deleted'); }
function delCol(id){ const col=findCol(id); if(!col) return; if(col.cards.length&&!confirm(`Delete "${col.name}" and its ${col.cards.length} card(s)?`)) return; S.columns=S.columns.filter(c=>c.id!==id); dirty();render();toast('Column deleted'); }

// ── Finders ────────────────────────────────────────────────────
function findCol(id){ return S.columns.find(c=>c.id===id); }
function findCard(id){ for(const col of S.columns){const card=col.cards.find(c=>c.id===id);if(card) return{col,card};} return{col:null,card:null}; }

// ── Utils ──────────────────────────────────────────────────────
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),2600); }

// ── Boot ───────────────────────────────────────────────────────
(async()=>{
  const hadLS=lsLoad();
  if(!hadLS) S=mkDefault();
  render();
  document.getElementById('btitle').textContent='🗂 '+S.title;
  setStatus('ss-ok',hadLS?'✓ Loaded':'✓ Ready');
  setHFile(null);
  tryAutoLink(!hadLS);
})();
</script>
